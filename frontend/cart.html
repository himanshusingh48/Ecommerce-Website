<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - Ecommerce</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="ecommerce.css">
  <style>
    .cart-page {
      padding: 50px 20px;
      max-width: 900px;
      margin: auto;
    }

    .cart-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .cart-header h2 {
      font-size: 2.5rem;
      color: #333;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .cart-item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }

    .item-details {
      flex: 1;
      margin-left: 20px;
    }

    .item-details h3 {
      margin: 0 0 5px 0;
      font-size: 1.2rem;
      color: #333;
    }

    .item-details p {
      margin: 0;
      color: #777;
      font-size: 0.95rem;
    }

    .item-actions button {
      background-color: #ff523b;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    .item-actions button:hover {
      background-color: #e04431;
    }

    .cart-summary {
      text-align: right;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px solid #eee;
    }

    .cart-summary h2 {
      font-size: 1.8rem;
      color: #333;
      margin-bottom: 20px;
    }

    .cart-actions {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
    }

    .btn-clear {
      background-color: #555;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
    }

    .btn-clear:hover {
      background-color: #333;
    }

    .btn-checkout {
      background-color: #4caf50;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-checkout:hover {
      background-color: #388e3c;
    }

    .back-home {
      display: inline-block;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
      font-weight: 600;
    }

    .back-home:hover {
      color: #ff523b;
      text-decoration: underline;
    }

    .empty-cart-msg {
      text-align: center;
      font-size: 1.2rem;
      color: #777;
      padding: 50px 0;
    }
  </style>
</head>

<body style="background: #f9f9f9;">

  <div class="cart-page">
    <div class="cart-header">
      <h2>Your Shopping Cart</h2>
    </div>

    <div id="cart-container"></div>

    <div style="text-align: center;">
      <a href="index.html" class="back-home">&larr; Continue Shopping</a>
    </div>
  </div>

  <script src="cart.js"></script>
</body>

</html>
